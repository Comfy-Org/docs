# Source of truth for code.mdx in this directory. Edit this file, then run
# `pnpm code-pages:gen`; never edit code.mdx by hand (CI checks it is fresh).
# `input` / `output` are the provider's documented shapes (JSON Schema in YAML) and
# are the fallback until Router publishes the model's schema in router-schemas/.
name: Ideogram 4.0
provider: Ideogram
description: >-
  Python, TypeScript and cURL snippets for generating images with Ideogram 4.0 over HTTP through Comfy
  Router, plus the request fields and the result shape
task: generation
variants:
- title: Ideogram 4.0
  model: ideogram/ideogram-v4
example:
  text_prompt: a single red maple leaf on a plain white background, studio lighting
  resolution: 1024x1024
  rendering_speed: DEFAULT
input:
  type: object
  properties:
    text_prompt:
      type: string
      description: Text description of the image. Provide this or `json_prompt`.
    json_prompt:
      type: object
      description: Structured prompt, as an alternative to `text_prompt`.
    resolution:
      type: string
      description: Output size as `WIDTHxHEIGHT`, for example `1024x1024` or `1536x1024`.
    rendering_speed:
      type: string
      description: Speed / quality trade-off.
      enum:
      - TURBO
      - DEFAULT
      - QUALITY
      default: DEFAULT
    enable_copyright_detection:
      type: boolean
      description: Reject outputs that match known copyrighted material.
output:
  type: object
  required:
  - data
  properties:
    created:
      type: string
      description: Timestamp of the generation.
      format: date-time
    data:
      type: array
      description: Generated images.
      items:
        type: object
        properties:
          url:
            type: string
            description: Temporary URL of the image. Download it promptly.
            format: uri
          prompt:
            type: string
            description: The prompt that was run.
          resolution:
            type: string
            description: Output size as `WIDTHxHEIGHT`.
          seed:
            type: integer
            description: Seed used for this image.
          is_image_safe:
            type: boolean
            description: Whether the image passed Ideogram's safety filter.
          style_type:
            type: string
            description: Style applied, for example `AUTO`.
result:
  path: data[0].url
  label: image
  example:
    created: '2026-08-27T21:00:00Z'
    data:
    - url: https://.../image.png
      prompt: a single red maple leaf on a plain white background, studio lighting
      resolution: 1024x1024
      seed: 1234567890
      is_image_safe: true
      style_type: AUTO
  note: The URL is temporary. Download the image promptly if you need to keep it.
