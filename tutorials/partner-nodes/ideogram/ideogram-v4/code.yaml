# Source of truth for code.mdx in this directory. Edit this file, then run
# `pnpm code-pages:gen`; never edit code.mdx by hand (CI checks it is fresh).
name: Ideogram 4.0
provider: Ideogram
description: >-
  Python, TypeScript and cURL snippets for generating images with Ideogram
  4.0 over HTTP through Comfy Router, plus the request fields and the result
  shape
task: generation

variants:
  - title: Ideogram 4.0
    model: ideogram/ideogram-v4

example:
  text_prompt: a single red maple leaf on a plain white background, studio lighting
  resolution: 1024x1024
  rendering_speed: DEFAULT

fields: >-
  Provide either `text_prompt` or a structured `json_prompt`. `resolution` is
  a `WIDTHxHEIGHT` string such as `1024x1024` or `1536x1024`;
  `rendering_speed` is `TURBO`, `DEFAULT` or `QUALITY`.
  `enable_copyright_detection` rejects outputs that match known copyrighted
  material.

result:
  path: data[0].url
  label: image
  example:
    created: "2026-08-27T21:00:00Z"
    data:
      - url: "https://.../image.png"
        prompt: a single red maple leaf on a plain white background, studio lighting
        resolution: 1024x1024
        seed: 1234567890
        is_image_safe: true
        style_type: AUTO
  note: The URL is temporary. Download the image promptly if you need to keep it.
