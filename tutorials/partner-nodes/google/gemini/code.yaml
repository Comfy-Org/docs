# Source of truth for code.mdx in this directory. Edit this file, then run
# `pnpm code-pages:gen`; never edit code.mdx by hand (CI checks it is fresh).
name: Google Gemini
provider: Google
description: >-
  Python, TypeScript and cURL snippets for calling Google Gemini text models
  over HTTP through Comfy Router, plus the request fields and the result
  shape
task: response

variants:
  - title: Gemini 3.1 Pro
    model: vertexai/gemini-3.1-pro-preview
  - title: Gemini 3.5 Flash
    model: vertexai/gemini-3.5-flash
  - title: Gemini 2.5 Pro
    model: vertexai/gemini-2.5-pro
  - title: Gemini 2.5 Flash
    model: vertexai/gemini-2.5-flash

example:
  contents:
    - role: user
      parts:
        - text: Describe a single red maple leaf on a white background in one sentence.
  generationConfig:
    temperature: 0.7
    maxOutputTokens: 256

fields: >-
  This is the Gemini `generateContent` body. `contents` is required: a list
  of turns, each with a `role` (`user` or `model`) and `parts`. A part is
  `text`, or `inlineData` with base64 content and a `mimeType` to send an
  image, audio or video alongside the prompt. `systemInstruction` sets the
  system prompt; `generationConfig` carries `temperature`, `topP`, `topK`,
  `maxOutputTokens`, `seed`, `stopSequences` and `thinkingConfig`; `tools`
  declares functions the model may call.

result:
  path: candidates[0].content.parts[0].text
  label: text
  example:
    candidates:
      - content:
          role: model
          parts:
            - text: "A single red maple leaf rests on a plain white background, its edges sharp and its color deep."
        finishReason: STOP
    usageMetadata:
      promptTokenCount: 18
      candidatesTokenCount: 24
