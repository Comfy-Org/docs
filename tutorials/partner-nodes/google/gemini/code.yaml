# Source of truth for code.mdx in this directory. Edit this file, then run
# `pnpm code-pages:gen`; never edit code.mdx by hand (CI checks it is fresh).
# `input` / `output` are the provider's documented shapes (JSON Schema in YAML) and
# are the fallback until Router publishes the model's schema in router-schemas/.
name: Google Gemini
provider: Google
description: >-
  Python, TypeScript and cURL snippets for calling Google Gemini text models over HTTP through Comfy Router,
  plus the request fields and the result shape
summary: >-
  Google Gemini is Google's family of multimodal text models, covering fast drafting through deep reasoning across the Flash and Pro tiers.
task: response
variants:
- title: Gemini 3.1 Pro
  model: vertexai/gemini-3.1-pro-preview
- title: Gemini 3.5 Flash
  model: vertexai/gemini-3.5-flash
- title: Gemini 2.5 Pro
  model: vertexai/gemini-2.5-pro
- title: Gemini 2.5 Flash
  model: vertexai/gemini-2.5-flash
example:
  contents:
  - role: user
    parts:
    - text: Describe a single red maple leaf on a white background in one sentence.
  generationConfig:
    temperature: 0.7
    maxOutputTokens: 256
input:
  type: object
  required:
  - contents
  properties:
    contents:
      type: array
      description: >-
        The conversation so far, oldest first. A part is `text`, or `inlineData` to send an image, audio
        or video alongside the prompt.
      items:
        type: object
        required:
        - role
        - parts
        properties:
          role:
            type: string
            description: Who authored the turn.
            enum:
            - user
            - model
          parts:
            type: array
            description: The turn's content parts.
            items:
              type: object
              properties:
                text:
                  type: string
                  description: A text part.
                inlineData:
                  type: object
                  description: An inline media part.
                  properties:
                    mimeType:
                      type: string
                      description: Media type, for example `image/png`.
                    data:
                      type: string
                      description: Base64-encoded media bytes.
    systemInstruction:
      type: object
      description: System prompt applied to the whole conversation.
      properties:
        parts:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
    generationConfig:
      type: object
      description: Sampling and length settings.
      properties:
        temperature:
          type: number
          description: Randomness of sampling. Defaults are model specific.
          minimum: 0
          maximum: 2
        topP:
          type: number
          description: Nucleus sampling threshold. Defaults are model specific.
        topK:
          type: integer
          description: Top-k sampling cutoff. Defaults are model specific.
        maxOutputTokens:
          type: integer
          description: Upper bound on generated tokens.
        seed:
          type: integer
          description: Seed for reproducible sampling.
        stopSequences:
          type: array
          description: Strings that end generation when produced.
          items:
            type: string
        thinkingConfig:
          type: object
          description: Reasoning effort controls on models that support it.
          properties:
            thinkingLevel:
              type: string
              enum:
              - MINIMAL
              - LOW
              - MEDIUM
              - HIGH
            includeThoughts:
              type: boolean
              description: Return the model's reasoning alongside the answer.
    tools:
      type: array
      description: Function declarations the model may call.
      items:
        type: object
        properties:
          functionDeclarations:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                parameters:
                  type: object
                  description: JSON Schema for the function's arguments.
output:
  type: object
  required:
  - candidates
  properties:
    candidates:
      type: array
      description: Generated candidates; one unless you asked for more.
      items:
        type: object
        properties:
          content:
            type: object
            properties:
              role:
                type: string
                enum:
                - model
              parts:
                type: array
                items:
                  type: object
                  properties:
                    text:
                      type: string
                      description: The generated text.
                    functionCall:
                      type: object
                      description: Present when the model chose to call one of your `tools`.
                      properties:
                        name:
                          type: string
                        args:
                          type: object
          finishReason:
            type: string
            description: 'Why generation stopped: `STOP`, `MAX_TOKENS`, `SAFETY`, ...'
    usageMetadata:
      type: object
      description: Token accounting for the call.
      properties:
        promptTokenCount:
          type: integer
          description: Tokens in the prompt.
        candidatesTokenCount:
          type: integer
          description: Tokens in the generated candidates.
result:
  path: candidates[0].content.parts[0].text
  label: text
  example:
    candidates:
    - content:
        role: model
        parts:
        - text: A single red maple leaf rests on a plain white background, its edges sharp and its color
            deep.
      finishReason: STOP
    usageMetadata:
      promptTokenCount: 18
      candidatesTokenCount: 24
provider_spec:
  url: https://generativelanguage.googleapis.com/$discovery/rest?version=v1beta
  request: GenerateContentRequest
  response: GenerateContentResponse
  omit:
  - model
  - store
  - serviceTier
  - cachedContent
  - toolConfig
  - promptFeedback
  - modelVersion
  - modelStatus
  - responseId
