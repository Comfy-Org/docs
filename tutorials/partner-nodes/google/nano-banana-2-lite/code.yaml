# Source of truth for code.mdx in this directory. Edit this file, then run
# `pnpm code-pages:gen`; never edit code.mdx by hand (CI checks it is fresh).
name: Nano Banana 2 Lite
provider: Google
description: >-
  Python, TypeScript and cURL snippets for generating images with Nano Banana 2 Lite
  (Gemini 3.1 Flash-Lite Image) over HTTP through Comfy Router, plus the request fields and the
  result shape
task: generation

variants:
  - title: Nano Banana 2 Lite
    model: vertexai/gemini-3.1-flash-lite-image

example:
  contents:
    - role: user
      parts:
        - text: a single red maple leaf on a plain white background, studio lighting
  generationConfig:
    responseModalities: [IMAGE]
    imageConfig:
      aspectRatio: "1:1"

fields: >-
  This is the Gemini `generateContent` body. `contents` is required: a list
  of turns, each with a `role` and `parts` (text, or `inlineData` with a
  base64 image and `mimeType` for image editing). Ask for an image with
  `generationConfig.responseModalities: ["IMAGE"]` and set the shape with
  `imageConfig.aspectRatio`. `seed` and `safetySettings` are also
  accepted.

result:
  path: candidates[0].content.parts[0].inlineData.data
  label: image (base64)
  example:
    candidates:
      - content:
          role: model
          parts:
            - inlineData:
                mimeType: image/png
                data: "iVBORw0KGgoAAAANSUhEUgAA..."
        finishReason: STOP
    usageMetadata:
      promptTokenCount: 12
      candidatesTokenCount: 1290
  note: >-
    The image comes back inline as base64 in `inlineData.data`, with its
    `mimeType` beside it. Decode it and write it to a file; there is no URL
    to download.
