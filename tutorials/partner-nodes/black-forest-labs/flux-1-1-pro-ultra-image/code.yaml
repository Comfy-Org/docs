# Source of truth for code.mdx in this directory. Edit this file, then run
# `pnpm code-pages:gen`; never edit code.mdx by hand (CI checks it is fresh).
# `input` / `output` are the provider's documented shapes (JSON Schema in YAML) and
# are the fallback until Router publishes the model's schema in router-schemas/.
name: Flux 1.1 Pro Ultra Image
provider: Black Forest Labs
description: >-
  Python, TypeScript and cURL snippets for calling FLUX 1.1 [pro] Ultra and FLUX 1.1 [pro] over HTTP through
  Comfy Router, plus the request fields and the result shape
task: generation
variants:
- title: FLUX 1.1 [pro] Ultra
  model: bfl/flux-pro-1.1-ultra
  example:
    prompt: a single red maple leaf on a plain white background, studio lighting
    aspect_ratio: '16:9'
    raw: false
  input:
    type: object
    required:
    - prompt
    properties:
      prompt:
        type: string
        description: Text description of the image to generate.
      aspect_ratio:
        type: string
        description: Output aspect ratio, from `21:9` to `9:21`.
        default: '16:9'
      raw:
        type: boolean
        description: Generate with the less processed, more natural aesthetic.
        default: false
      image_prompt:
        type: string
        description: Optional base64 image to blend with the prompt.
      image_prompt_strength:
        type: number
        description: How strongly `image_prompt` steers the result.
        minimum: 0
        maximum: 1
        default: 0.1
      seed:
        type: integer
        description: Seed for reproducible results. Omit for random.
      safety_tolerance:
        type: integer
        description: Moderation tolerance for inputs and outputs. 0 is strictest.
        minimum: 0
        maximum: 6
        default: 2
      output_format: &id001
        type: string
        description: Format of the returned image.
        enum:
        - jpeg
        - png
        default: jpeg
- title: FLUX 1.1 [pro]
  model: bfl/flux-pro-1.1
  example:
    prompt: a single red maple leaf on a plain white background, studio lighting
    width: 1024
    height: 768
  input:
    type: object
    required:
    - prompt
    properties:
      prompt:
        type: string
        description: Text description of the image to generate.
      width:
        type: integer
        description: Output width in pixels, a multiple of 32.
        minimum: 256
        maximum: 1440
        default: 1024
      height:
        type: integer
        description: Output height in pixels, a multiple of 32.
        minimum: 256
        maximum: 1440
        default: 768
      prompt_upsampling:
        type: boolean
        description: Rewrite the prompt for richer results. Results are not reproducible when enabled.
        default: false
      image_prompt:
        type: string
        description: Optional base64 image to use as an image prompt.
      seed:
        type: integer
        description: Seed for reproducible results. Omit for random.
      safety_tolerance:
        type: integer
        description: Moderation tolerance for inputs and outputs. 0 is strictest.
        minimum: 0
        maximum: 6
        default: 2
      output_format: *id001
example:
  prompt: a single red maple leaf on a plain white background, studio lighting
output:
  type: object
  required:
  - id
  - status
  - result
  properties:
    id:
      type: string
      description: BFL task id for this generation.
    status:
      type: string
      description: Terminal task status. Router only returns once this is `Ready`.
      enum:
      - Ready
    result:
      type: object
      required:
      - sample
      properties:
        sample:
          type: string
          description: 'Signed URL of the generated image. Temporary: download it promptly.'
          format: uri
        prompt:
          type: string
          description: The prompt that was run, after any upsampling.
        seed:
          type: integer
          description: Seed used for this generation.
result:
  path: result.sample
  label: image
  example:
    id: 0a1b2c3d-...
    status: Ready
    result:
      sample: https://.../out.jpeg
      prompt: a single red maple leaf on a plain white background, studio lighting
      seed: 1234567890
  note: The URL is temporary. Download the image promptly if you need to keep it.
