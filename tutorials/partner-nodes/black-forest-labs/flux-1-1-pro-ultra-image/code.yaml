# Source of truth for code.mdx in this directory. Edit this file, then run
# `pnpm code-pages:gen`; never edit code.mdx by hand (CI checks it is fresh).
name: Flux 1.1 Pro Ultra Image
provider: Black Forest Labs
description: >-
  Python, TypeScript and cURL snippets for calling FLUX 1.1 [pro] Ultra and
  FLUX 1.1 [pro] over HTTP through Comfy Router, plus the request fields and
  the result shape
task: generation

# Ultra and standard take different bodies, so each variant carries its own example.
variants:
  - title: FLUX 1.1 [pro] Ultra
    model: bfl/flux-pro-1.1-ultra
    example:
      prompt: a single red maple leaf on a plain white background, studio lighting
      aspect_ratio: "16:9"
      raw: false
  - title: FLUX 1.1 [pro]
    model: bfl/flux-pro-1.1
    example:
      prompt: a single red maple leaf on a plain white background, studio lighting
      width: 1024
      height: 768

example:
  prompt: a single red maple leaf on a plain white background, studio lighting

fields: >-
  `prompt` is required for both. Ultra takes `aspect_ratio` (from `21:9` to
  `9:21`) and `raw` (true for the less processed, more natural look); the
  standard model takes `width` and `height` in multiples of 32 up to 1440.
  Both accept `seed`, `safety_tolerance`, `output_format` and an
  `image_prompt` for image-to-image.

result:
  path: result.sample
  label: image
  example:
    id: "0a1b2c3d-..."
    status: Ready
    result:
      sample: "https://.../out.jpeg"
      prompt: a single red maple leaf on a plain white background, studio lighting
      seed: 1234567890
  note: The URL is temporary. Download the image promptly if you need to keep it.
