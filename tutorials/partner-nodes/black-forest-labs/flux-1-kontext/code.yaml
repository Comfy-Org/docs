# Source of truth for code.mdx in this directory. Edit this file, then run
# `pnpm code-pages:gen`; never edit code.mdx by hand (CI checks it is fresh).
name: Flux.1 Kontext
provider: Black Forest Labs
description: >-
  Python, TypeScript and cURL snippets for calling Flux.1 Kontext Pro and
  Kontext Max over HTTP through Comfy Router, plus the request fields and the
  result shape
task: image editing

variants:
  - title: Kontext Pro
    model: bfl/flux-kontext-pro
  - title: Kontext Max
    model: bfl/flux-kontext-max

# The request body every snippet sends. A string value of the form
# "@file:<path>" is read from disk and base64 encoded by the snippet.
example:
  prompt: replace the background with a sunlit beach, keep the subject unchanged
  input_image: "@file:input.jpg"
  aspect_ratio: "1:1"

fields: >-
  `prompt` and `input_image` are required. `input_image` is the image to edit,
  base64 encoded. `aspect_ratio` sets the output ratio between `3:7` and `7:3`;
  `seed`, `prompt_upsampling`, `safety_tolerance` and `output_format` are the
  fields you will reach for next.

result:
  path: result.sample
  label: image
  example:
    id: "0a1b2c3d-..."
    status: Ready
    result:
      sample: "https://.../out.jpeg"
      prompt: replace the background with a sunlit beach, keep the subject unchanged
      seed: 1234567890
  note: The URL is temporary. Download the image promptly if you need to keep it.
