# Source of truth for code.mdx in this directory. Edit this file, then run
# `pnpm code-pages:gen`; never edit code.mdx by hand (CI checks it is fresh).
name: FLUX 3 Video
provider: Black Forest Labs
description: >-
  Python, TypeScript and cURL snippets for generating video with synchronized
  audio from FLUX 3 over HTTP through Comfy Router, plus the request fields
  and the result shape
task: video generation

variants:
  - title: FLUX 3 Video
    model: bfl/flux-3-video

example:
  mode: t2v
  prompt: a single red maple leaf falling onto still water, slow motion
  duration: 5
  aspect_ratio: "16:9"
  generate_audio: true

fields: >-
  `mode` is required: `t2v` for text-to-video, `i2v` to continue from one or
  more images passed in `keyframes` (URLs or base64), or `v2v` to continue a
  video passed in `start_video`. `prompt` is required in every mode except
  `draft_enhance`. `duration` is any whole second from 5 to 20 or `auto`;
  `aspect_ratio` accepts `auto`, `21:9`, `2:1`, `16:9`, `4:3`, `1:1`, `3:4` or
  `9:16`; `resolution` is `hd` or `fhd`. Router holds the connection for the
  whole render, so a 20 second clip takes minutes, not seconds.

result:
  path: result.sample
  label: video
  example:
    id: "0a1b2c3d-..."
    status: Ready
    result:
      sample: "https://.../out.mp4"
  note: >-
    `result.sample` is a signed URL that expires roughly two hours after the
    result is ready. Download the MP4 promptly.
