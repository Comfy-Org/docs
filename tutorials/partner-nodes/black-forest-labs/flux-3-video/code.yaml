# Source of truth for code.mdx in this directory. Edit this file, then run
# `pnpm code-pages:gen`; never edit code.mdx by hand (CI checks it is fresh).
# `input` / `output` are the provider's documented shapes (JSON Schema in YAML) and
# are the fallback until Router publishes the model's schema in router-schemas/.
name: FLUX 3 Video
provider: Black Forest Labs
description: >-
  Python, TypeScript and cURL snippets for generating video with synchronized audio from FLUX 3 over HTTP
  through Comfy Router, plus the request fields and the result shape
task: video generation
variants:
- title: FLUX 3 Video
  model: bfl/flux-3-video
example:
  mode: t2v
  prompt: a single red maple leaf falling onto still water, slow motion
  duration: 5
  aspect_ratio: '16:9'
  generate_audio: true
input:
  type: object
  required:
  - mode
  properties:
    mode:
      type: string
      description: >-
        Generation mode: `t2v` text-to-video, `i2v` continue from images in `keyframes`, `v2v` continue
        the video in `start_video`, `draft_enhance` full-quality render of a prior draft.
      enum:
      - t2v
      - i2v
      - v2v
      - draft_enhance
    prompt:
      type: string
      description: Free-form description of the video. Required in every mode except `draft_enhance`.
    keyframes:
      type: array
      description: >-
        `i2v` only. One to ten images (HTTPS URLs or base64) that become frames: one starts the video,
        two start and end it, more are spread evenly.
      items:
        type: string
    start_video:
      type: string
      description: '`v2v` only. The video to continue, as an HTTPS URL or base64 MP4.'
    duration:
      type: integer
      description: Video length in whole seconds, or `auto` to fit the content.
      minimum: 5
      maximum: 20
      default: auto
    aspect_ratio:
      type: string
      description: Output aspect ratio. `auto` lets BFL choose from the inputs.
      enum:
      - auto
      - '21:9'
      - '2:1'
      - '16:9'
      - '4:3'
      - '1:1'
      - '3:4'
      - '9:16'
      default: auto
    resolution:
      type: string
      description: '`hd`, or `fhd` for a higher-resolution result finished by the video upsampler.'
      enum:
      - hd
      - fhd
      default: hd
    generate_audio:
      type: boolean
      description: Generate synchronized audio alongside the video.
      default: true
    safety_tolerance:
      type: integer
      description: Moderation tolerance for inputs and outputs. 0 is strictest.
      minimum: 0
      maximum: 2
      default: 2
    draft:
      type: boolean
      description: Generate a fast preview instead of the full render.
      default: false
output:
  type: object
  required:
  - id
  - status
  - result
  properties:
    id:
      type: string
      description: BFL task id for this generation.
    status:
      type: string
      description: Terminal task status. Router only returns once this is `Ready`.
      enum:
      - Ready
    result:
      type: object
      required:
      - sample
      properties:
        sample:
          type: string
          description: Signed URL of the generated MP4. Expires roughly two hours after the result is
            ready.
          format: uri
        cost:
          type: number
          description: Provider-reported cost of the task, when BFL supplies it.
result:
  path: result.sample
  label: video
  example:
    id: 0a1b2c3d-...
    status: Ready
    result:
      sample: https://.../out.mp4
  note: >-
    `result.sample` is a signed URL that expires roughly two hours after the result is ready. Download
    the MP4 promptly.
