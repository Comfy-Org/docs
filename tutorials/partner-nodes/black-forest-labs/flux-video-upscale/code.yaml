# Source of truth for code.mdx in this directory. Edit this file, then run
# `pnpm code-pages:gen`; never edit code.mdx by hand (CI checks it is fresh).
name: FLUX Video Upscale
provider: Black Forest Labs
description: >-
  Python, TypeScript and cURL snippets for upscaling a video with FLUX Video
  Upscale over HTTP through Comfy Router, plus the request fields and the
  result shape
task: upscale

variants:
  - title: FLUX Video Upscale
    model: bfl/video-upscale-v1

example:
  input_video: "https://your-host.example/clip.mp4"
  upscale_factor: 2
  creativity: 1

fields: >-
  `input_video` is required: an HTTP(S) URL or a base64-encoded MP4 of at
  most 20 seconds and 50MB. `upscale_factor` multiplies the resolution
  (default 2). `creativity` from 0 to 10 sets how much new detail the model
  is allowed to invent; keep it low to preserve faces and products, raise it
  for generated footage. An optional `prompt` steers that added detail.

result:
  path: result.sample
  label: video
  example:
    id: "0a1b2c3d-..."
    status: Ready
    result:
      sample: "https://.../upscaled.mp4"
  note: >-
    `result.sample` is a signed URL that expires roughly two hours after the
    result is ready. Download the MP4 promptly.
