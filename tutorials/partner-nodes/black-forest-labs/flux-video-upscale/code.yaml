# Source of truth for code.mdx in this directory. Edit this file, then run
# `pnpm code-pages:gen`; never edit code.mdx by hand (CI checks it is fresh).
# `input` / `output` are the provider's documented shapes (JSON Schema in YAML) and
# are the fallback until Router publishes the model's schema in router-schemas/.
name: FLUX Video Upscale
provider: Black Forest Labs
description: >-
  Python, TypeScript and cURL snippets for upscaling a video with FLUX Video Upscale over HTTP through
  Comfy Router, plus the request fields and the result shape
task: upscale
variants:
- title: FLUX Video Upscale
  model: bfl/video-upscale-v1
example:
  input_video: https://your-host.example/clip.mp4
  upscale_factor: 2
  creativity: 1
input:
  type: object
  required:
  - input_video
  properties:
    input_video:
      type: string
      description: The video to upscale, as an HTTPS URL or a base64-encoded MP4. At most 20 seconds and
        50MB.
    upscale_factor:
      type: number
      description: Resolution multiplier.
      default: 2
    creativity:
      type: integer
      description: >-
        How much new detail the model may invent. Keep it low to preserve faces and products; raise it
        for generated footage.
      minimum: 0
      maximum: 10
      default: 1
    prompt:
      type: string
      description: Optional guidance for the added detail.
    safety_tolerance:
      type: integer
      description: Moderation tolerance for inputs and outputs. 0 is strictest.
      minimum: 0
      maximum: 2
      default: 2
output:
  type: object
  required:
  - id
  - status
  - result
  properties:
    id:
      type: string
      description: BFL task id for this generation.
    status:
      type: string
      description: Terminal task status. Router only returns once this is `Ready`.
      enum:
      - Ready
    result:
      type: object
      required:
      - sample
      properties:
        sample:
          type: string
          description: Signed URL of the generated MP4. Expires roughly two hours after the result is
            ready.
          format: uri
        cost:
          type: number
          description: Provider-reported cost of the task, when BFL supplies it.
result:
  path: result.sample
  label: video
  example:
    id: 0a1b2c3d-...
    status: Ready
    result:
      sample: https://.../upscaled.mp4
  note: >-
    `result.sample` is a signed URL that expires roughly two hours after the result is ready. Download
    the MP4 promptly.
