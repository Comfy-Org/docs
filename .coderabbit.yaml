# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  path_instructions:
    - path: "built-in-nodes/**"
      instructions: |
        These pages are generated. Do not ask for edits to `title`, `description` or
        `sidebarTitle`: `docs-generation/scripts/sync_to_comfy_docs.py` in
        Comfy-Org/embedded-docs writes them, with the English title following the
        `<Node> - ComfyUI Built-in Node Documentation` template for every locale, and a
        per-page change here is reverted by the next weekly sync.

        Content corrections belong upstream in
        `comfyui_embedded_docs/docs/<Node>/<lang>.md`, so report them as questions about
        the source rather than as edits to the generated page. Still worth flagging:
        an internal contradiction in one page, a claim that contradicts the node schema
        in Comfy-Org/ComfyUI, and a table that disagrees with its own prose.
    - path: "{zh,ja,ko,es}/built-in-nodes/**"
      instructions: |
        Generated localized mirror of `built-in-nodes/**`. The localized `title`,
        `description` and `sidebarTitle` are owned by the docs i18n pipeline, so flag them
        only when they regress against the base branch, for example a human label replaced
        by the node class name. That regression is a defect in the sync tool and is worth
        reporting on the PR.
