# Source of truth for code.mdx in this directory. Edit this file, then run
# `pnpm code-pages:gen`; never edit code.mdx by hand (CI checks it is fresh).
# `input` / `output` are the provider's documented shapes (JSON Schema in YAML) and
# are the fallback until Router publishes the model's schema in router-schemas/.
name: Flux.1 Kontext
provider: Black Forest Labs
description: >-
  Python, TypeScript and cURL snippets for calling Flux.1 Kontext Pro and Kontext Max over HTTP through
  Comfy Router, plus the request fields and the result shape
summary: >-
  Flux.1 Kontext is Black Forest Labs' instruction-driven image editing model: send an image and a text instruction, get the edited image back with the rest of the scene preserved.
task: image editing
variants:
- title: Kontext Pro
  model: bfl/flux-kontext-pro
  provider_spec:
    url: https://api.bfl.ai/openapi.json
    operation: POST /v1/flux-kontext-pro
    response_operation: GET /v1/get_result
    omit:
    - webhook_url
    - webhook_secret
- title: Kontext Max
  model: bfl/flux-kontext-max
  provider_spec:
    url: https://api.bfl.ai/openapi.json
    operation: POST /v1/flux-kontext-max
    response_operation: GET /v1/get_result
    omit:
    - webhook_url
    - webhook_secret
example:
  prompt: replace the background with a sunlit beach, keep the subject unchanged
  input_image: '@file:input.jpg'
  aspect_ratio: '1:1'
input:
  type: object
  required:
  - prompt
  properties:
    prompt:
      type: string
      description: What to change in the image. Describe the edit, not the whole scene.
    input_image:
      type: string
      description: >-
        The image to edit, base64 encoded or an HTTPS URL. Optional in the schema, but Kontext is an editing
        model: without it you get text-to-image.
    aspect_ratio:
      type: string
      description: Output aspect ratio, from `21:9` to `9:21`.
    seed:
      type: integer
      description: Seed for reproducible results. Omit for random.
    prompt_upsampling:
      type: boolean
      description: Rewrite the prompt for richer results. Results are not reproducible when enabled.
      default: false
    safety_tolerance:
      type: integer
      description: Moderation tolerance for inputs and outputs. 0 is strictest.
      minimum: 0
      maximum: 6
      default: 2
    output_format:
      type: string
      description: Format of the returned image.
      enum:
      - jpeg
      - png
      - webp
      default: png
    input_image_2:
      type: string
      description: Additional reference image (base64 or HTTPS URL). Experimental multi-reference input.
    input_image_3:
      type: string
      description: Additional reference image (base64 or HTTPS URL). Experimental multi-reference input.
    input_image_4:
      type: string
      description: Additional reference image (base64 or HTTPS URL). Experimental multi-reference input.
output:
  type: object
  required:
  - id
  - status
  - result
  properties:
    id:
      type: string
      description: BFL task id for this generation.
    status:
      type: string
      description: Terminal task status. Router only returns once this is `Ready`.
      enum:
      - Ready
    result:
      type: object
      required:
      - sample
      properties:
        sample:
          type: string
          description: 'Signed URL of the generated image. Temporary: download it promptly.'
          format: uri
        prompt:
          type: string
          description: The prompt that was run, after any upsampling.
        seed:
          type: integer
          description: Seed used for this generation.
result:
  path: result.sample
  label: image
  example:
    id: 0a1b2c3d-...
    status: Ready
    result:
      sample: https://.../out.png
      prompt: replace the background with a sunlit beach, keep the subject unchanged
      seed: 1234567890
  note: The URL is temporary. Download the image promptly if you need to keep it.
