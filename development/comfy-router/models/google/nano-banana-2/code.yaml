# Source of truth for code.mdx in this directory. Edit this file, then run
# `pnpm code-pages:gen`; never edit code.mdx by hand (CI checks it is fresh).
# `input` / `output` are the provider's documented shapes (JSON Schema in YAML) and
# are the fallback until Router publishes the model's schema in router-schemas/.
name: Nano Banana 2
provider: Google
description: >-
  Python, TypeScript and cURL snippets for generating images with Nano Banana 2 (Gemini 3.1 Flash Image)
  over HTTP through Comfy Router, plus the request fields and the result shape
summary: >-
  Nano Banana 2 (Gemini 3.1 Flash Image) is Google's image generation and editing model, balancing quality and speed.
task: generation
variants:
- title: Nano Banana 2
  model: vertexai/gemini-3.1-flash-image
example:
  contents:
  - role: user
    parts:
    - text: a single red maple leaf on a plain white background, studio lighting
  generationConfig:
    responseModalities:
    - IMAGE
    imageConfig:
      aspectRatio: '1:1'
input:
  type: object
  required:
  - contents
  properties:
    contents:
      type: array
      description: >-
        The conversation so far. For a single image, one `user` turn with a text part; add an `inlineData`
        image part to edit an existing image.
      items:
        type: object
        required:
        - role
        - parts
        properties:
          role:
            type: string
            description: Who authored the turn.
            enum:
            - user
            - model
          parts:
            type: array
            description: The turn's content parts.
            items:
              type: object
              properties:
                text:
                  type: string
                  description: A text part.
                inlineData:
                  type: object
                  description: An inline media part.
                  properties:
                    mimeType:
                      type: string
                      description: Media type, for example `image/png`.
                    data:
                      type: string
                      description: Base64-encoded media bytes.
    generationConfig:
      type: object
      description: Generation settings.
      properties:
        responseModalities:
          type: array
          description: Ask for an image with `["IMAGE"]`, or `["TEXT", "IMAGE"]` to also get a caption.
          items:
            type: string
            enum:
            - TEXT
            - IMAGE
        imageConfig:
          type: object
          description: Image output settings.
          properties:
            aspectRatio:
              type: string
              description: Output aspect ratio, for example `1:1`, `16:9`, `9:16`.
        seed:
          type: integer
          description: Seed for reproducible results.
    safetySettings:
      type: array
      description: Per-category harm thresholds.
      items:
        type: object
        properties:
          category:
            type: string
            enum:
            - HARM_CATEGORY_SEXUALLY_EXPLICIT
            - HARM_CATEGORY_HATE_SPEECH
            - HARM_CATEGORY_HARASSMENT
            - HARM_CATEGORY_DANGEROUS_CONTENT
          threshold:
            type: string
            enum:
            - BLOCK_NONE
            - BLOCK_LOW_AND_ABOVE
            - BLOCK_MEDIUM_AND_ABOVE
            - BLOCK_ONLY_HIGH
output:
  type: object
  properties:
    candidates:
      type: array
      description: Generated candidates; one unless you asked for more.
      items:
        type: object
        properties:
          content:
            type: object
            properties:
              role:
                type: string
                enum:
                - model
              parts:
                type: array
                items:
                  type: object
                  properties:
                    inlineData:
                      type: object
                      description: The generated image, inline.
                      properties:
                        mimeType:
                          type: string
                          description: Media type of the image, typically `image/png`.
                        data:
                          type: string
                          description: Base64-encoded image bytes. Decode and write to a file; there is
                            no URL.
                    text:
                      type: string
                      description: Present when `TEXT` was among the requested modalities.
          finishReason:
            type: string
            description: Why generation stopped, for example `STOP`.
    usageMetadata:
      type: object
      description: Token accounting for the call.
      properties:
        promptTokenCount:
          type: integer
          description: Tokens in the prompt.
        candidatesTokenCount:
          type: integer
          description: Tokens in the generated candidates.
    promptFeedback:
      type: object
      description: >-
        Present when the prompt itself was blocked. It is the only field returned in that case, so
        check for it before reading the result.
      properties:
        blockReason:
          type: string
          description: Why the prompt was blocked. No candidates are returned; rephrase the prompt and retry.
          enum:
          - SAFETY
          - OTHER
          - BLOCKLIST
          - PROHIBITED_CONTENT
          - IMAGE_SAFETY
result:
  path: candidates[0].content.parts[0].inlineData.data
  label: image (base64)
  example:
    candidates:
    - content:
        role: model
        parts:
        - inlineData:
            mimeType: image/png
            data: iVBORw0KGgoAAAANSUhEUgAA...
      finishReason: STOP
    usageMetadata:
      promptTokenCount: 12
      candidatesTokenCount: 1290
  note: >-
    The image comes back inline as base64 in `inlineData.data`, with its `mimeType` beside it. Decode
    it and write it to a file; there is no URL to download.
provider_spec:
  url: https://generativelanguage.googleapis.com/$discovery/rest?version=v1beta
  request: GenerateContentRequest
  response: GenerateContentResponse
  omit:
  - promptFeedback.safetyRatings
  - model
  - store
  - serviceTier
  - cachedContent
  - toolConfig
  - modelVersion
  - modelStatus
  - responseId
