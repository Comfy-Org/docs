# Source of truth for code.mdx in this directory. Edit this file, then run
# `pnpm code-pages:gen`; never edit code.mdx by hand (CI checks it is fresh).
# `input` / `output` are the provider's documented shapes (JSON Schema in YAML) and
# are the fallback until Router publishes the model's schema in router-schemas/.
name: Nano Banana Pro
provider: Google
description: >-
  Python, TypeScript, Swift and cURL snippets for Nano Banana Pro (Gemini 3 Pro Image) image generation
  through Comfy Router, plus request fields
summary: >-
  Nano Banana Pro (Gemini 3 Pro Image) is the Pro tier of Google's Nano Banana image generation family, aimed at complex scenes and legible text.
task: generation
variants:
- title: Nano Banana Pro
  model: vertexai/gemini-3-pro-image
example:
  contents:
  - role: user
    parts:
    - text: a single red maple leaf on a plain white background, studio lighting
  generationConfig:
    responseModalities:
    - IMAGE
    imageConfig:
      aspectRatio: '1:1'
input:
  type: object
  required:
  - contents
  properties:
    contents:
      type: array
      description: >-
        The conversation so far. For a single image, one `user` turn with a text part; add an `inlineData`
        image part to edit an existing image.
      items:
        type: object
        required:
        - role
        - parts
        properties:
          role:
            type: string
            description: Who authored the turn.
            enum:
            - user
            - model
          parts:
            type: array
            description: The turn's content parts.
            items:
              type: object
              properties:
                text:
                  type: string
                  description: A text part.
                inlineData:
                  type: object
                  description: An inline media part.
                  properties:
                    mimeType:
                      type: string
                      description: Media type, for example `image/png`.
                    data:
                      type: string
                      description: Base64-encoded media bytes.
    generationConfig:
      type: object
      description: Generation settings.
      properties:
        responseModalities:
          type: array
          description: Ask for an image with `["IMAGE"]`, or `["TEXT", "IMAGE"]` to also get a caption.
          items:
            type: string
            enum:
            - TEXT
            - IMAGE
        imageConfig:
          type: object
          description: Image output settings.
          properties:
            aspectRatio:
              type: string
              description: Output aspect ratio, for example `1:1`, `16:9`, `9:16`.
            imageSize:
              type: string
              description: Output resolution class.
              enum:
              - 1K
              - 2K
              - 4K
        seed:
          type: integer
          description: Seed for reproducible results.
    safetySettings:
      type: array
      description: Per-category harm thresholds.
      items:
        type: object
        properties:
          category:
            type: string
            enum:
            - HARM_CATEGORY_SEXUALLY_EXPLICIT
            - HARM_CATEGORY_HATE_SPEECH
            - HARM_CATEGORY_HARASSMENT
            - HARM_CATEGORY_DANGEROUS_CONTENT
          threshold:
            type: string
            enum:
            - BLOCK_NONE
            - BLOCK_LOW_AND_ABOVE
            - BLOCK_MEDIUM_AND_ABOVE
            - BLOCK_ONLY_HIGH
output:
  type: object
  properties:
    candidates:
      type: array
      description: Generated candidates; one unless you asked for more.
      items:
        type: object
        properties:
          content:
            type: object
            properties:
              role:
                type: string
                enum:
                - model
              parts:
                type: array
                items:
                  type: object
                  properties:
                    inlineData:
                      type: object
                      description: The generated image, inline.
                      properties:
                        mimeType:
                          type: string
                          description: Media type of the image, typically `image/png`.
                        data:
                          type: string
                          description: Base64-encoded image bytes. Decode and write to a file when this part
                            contains `inlineData`.
                    text:
                      type: string
                      description: Present when `TEXT` was among the requested modalities.
                    thoughtSignature:
                      type: string
                      description: >-
                        An opaque base64 signature of the model's reasoning for this part, so the thought
                        can be reused in a later request. Measured at roughly 1 to 2 MB per part, which is
                        comparable to the image itself; budget for it or drop it explicitly.
          finishReason:
            type: string
            description: Why generation stopped, for example `STOP`.
    usageMetadata:
      type: object
      description: Token accounting for the call.
      properties:
        promptTokenCount:
          type: integer
          description: Tokens in the prompt.
        candidatesTokenCount:
          type: integer
          description: Tokens in the generated candidates.
    promptFeedback:
      type: object
      description: >-
        Present when the prompt itself was blocked. Check whether `candidates` is present before
        reading the result; `usageMetadata` can also appear on a blocked response.
      properties:
        blockReason:
          type: string
          description: Why the prompt was blocked. No candidates are returned; rephrase the prompt and retry.
          enum:
          - SAFETY
          - OTHER
          - BLOCKLIST
          - PROHIBITED_CONTENT
          - IMAGE_SAFETY
result:
  path: candidates[0].content.parts[0].inlineData.data
  label: image (base64)
  example:
    candidates:
    - content:
        role: model
        parts:
        - inlineData:
            mimeType: image/png
            data: PGJhc2U2ND4=
      finishReason: STOP
    usageMetadata:
      promptTokenCount: 12
      candidatesTokenCount: 1290
  note: |-
    ### Reading the parts

    By default, generated image parts contain base64 bytes in `inlineData.data` and a media type in `inlineData.mimeType`. Decode the bytes and save them to a file. With `uploadImagesToStorage: true`, uploaded images instead use `fileData.fileUri` for a signed URL and `fileData.mimeType` for the media type. Download these images before the URLs expire, 24 hours after they are created.

    **`fileData` can appear on a response that did not ask for it.** The two shapes are per part, not per response: when `uploadImagesToStorage: true` is set, an image whose upload fails is left as `inlineData`, so one response can mix both. Branch on which key is present rather than on what you requested. The one case that cannot happen is the reverse: with the field unset or false, every generated image comes back as `inlineData` and no `fileData` image part is produced. Text parts can also appear, and the image is not guaranteed to be the first part, so select a part by the field you need rather than by index. The `candidates[0].content.parts[0].inlineData.data` path in the quickstart samples above reads the single inline part of the sample response on this page; against a real response, scan `parts` for the key you want instead of indexing position 0.

    **`thoughtSignature` is a part field too, and it is large.** A part can carry `thoughtSignature`, an opaque base64 signature of the model's reasoning that exists so the thought can be replayed in a later request. It is absent from the generated schema above, which follows the request/response document Router publishes. Measured on real responses it runs roughly 1 to 2 MB per part, comparable to the image itself, so it is worth budgeting for or discarding explicitly if you are logging responses, forwarding them through a serverless function, or storing them.

    ### `imageSize` is a class, not a width

    `generationConfig.imageConfig.imageSize` takes `1K`, `2K` or `4K`, and each step up doubles both edges rather than setting a width. A 16:9 request measured 1376x768 at about 1.35 MB under `1K` and 2752x1536 at about 5.6 MB under `2K`: the same aspect ratio, four times the pixels and roughly four times the bytes. `2K` therefore does not mean a 2048-pixel-wide image, and sizing an upload path, a response body limit or a storage bucket against `2K` as if it were a width will under-provision it by about four times.

    ### Reference chaining

    Feeding a previously generated image straight back in gets a new camera angle on the same subject, so a sequence of shots of one scene is a chain of calls rather than one prompt that has to describe everything at once. Architecture, materials and lighting often carry across a chain, but the model does not guarantee it; treat continuity as a likely result to check, not a property you can rely on.

    Send the image back in whichever shape the previous response used. For an `inlineData` part, take the base64 bytes from `inlineData.data` and send them unchanged as `inlineData`, as below. For a part that came back as `fileData` under `uploadImagesToStorage: true`, send its `fileData.fileUri` and `fileData.mimeType` as a `fileData` part instead, while the signed URL is still valid; re-uploading the bytes as `inlineData` also works and does not expire. Then ask for the change you want:

    ```json
    {
      "contents": [
        {
          "role": "user",
          "parts": [
            {
              "inlineData": {
                "mimeType": "image/png",
                "data": "<the base64 from candidates[0].content.parts[].inlineData.data of the previous response>"
              }
            },
            { "text": "the same room, viewed from the opposite corner at eye level" }
          ]
        }
      ],
      "generationConfig": {
        "responseModalities": ["IMAGE"],
        "imageConfig": { "aspectRatio": "16:9" }
      }
    }
    ```

    Each call is independent, so pass the image you want to build on rather than relying on conversation history. Watch the request body size when you chain: the inline image counts against Router's [request body cap](/development/comfy-router/limitations#request-bodies-are-capped), and a `2K` image is about four times the bytes of a `1K` one.
provider_spec:
  url: https://generativelanguage.googleapis.com/$discovery/rest?version=v1beta
  request: GenerateContentRequest
  response: GenerateContentResponse
  omit:
  - promptFeedback.safetyRatings
  - model
  - store
  - serviceTier
  - cachedContent
  - toolConfig
  - modelVersion
  - modelStatus
  - responseId
