# Source of truth for code.mdx in this directory. Edit this file, then run
# `pnpm code-pages:gen`; never edit code.mdx by hand (CI checks it is fresh).
# The request and response fields render from router-schemas/minimax/minimax-h3.json,
# the schema Router validates a call against. Only the example body and the
# prose below live here.
name: MiniMax H3
provider: MiniMax
description: >-
  Call minimax/minimax-h3 through Comfy Router: endpoint, request shape, and the MP4 with native
  stereo audio that Router returns
summary: >-
  MiniMax H3 (Hailuo 03) is an omni-modal video model. It generates the picture and its audio track
  together in one pass, so a finished clip already carries dialogue, sound effects and music.
task: generation
variants:
- title: MiniMax H3
  model: minimax/minimax-h3
example:
  content:
  - text: A single red maple leaf resting on a plain white background.
    type: text
  duration: 5
  ratio: '16:9'
  resolution: 768P
result:
  path: task.content.url
  label: video
  example:
    task:
      content:
        url: https://example.invalid/minimax/minimax-h3/generated.mp4
      duration: 6
      id: 3f7a1b28-5c0d-4e91-8a6f-1b2c3d4e5f60
      model: MiniMax-H3
      ratio: '16:9'
      resolution: 768P
      status: succeeded
      usage:
        output_seconds: 6
        total_seconds: 6
  note: >-
    **The MP4 carries a generated audio track.** H3 is omni-modal: voice, sound effects and music are
    synthesised jointly with the picture in a single forward pass, not layered on afterwards, and the
    result is one MP4 with native stereo audio. Nothing in the request body above switches that off:
    the documented fields are the prompt content, `duration`, `ratio`, `resolution`, `seed`,
    `aigc_watermark` and `callback_url`, and none of them selects a silent render. A pipeline that
    means to lay its own voiceover over the clip therefore has to mute or strip the returned track
    first, or it will mux over a clip that is already talking. The
    prompt is what steers the audio: describe the dialogue, the sound effects and the music in the
    same prompt block as the shot. See the [MiniMax H3 prompt guide](/tutorials/video/minimax/minimax-h3-prompt-guide)
    for how to structure one, and the [MiniMax H3 overview](/tutorials/video/minimax/minimax-h3) for
    what the model does in ComfyUI.


    The video URL expires. Router re-hosts the MP4 and answers a Comfy-signed URL valid for 12 hours,
    falling back to MiniMax's own shorter-lived link when the re-host fails. The `task.content.url`
    description in the response schema above tells you to query again for a refreshed URL: that is
    MiniMax's own wording for their API, carried through unchanged, and Router does not expose
    MiniMax's task-query route. Re-reading a queued request's result route returns the stored result
    document while the request is [retained, for 24 hours after it
    completes](/development/comfy-router/queue#idempotency-and-billing), but nothing documents that
    read as minting a newly signed URL. Download the MP4 promptly rather than storing the link.
