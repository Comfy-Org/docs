name: CMS Script Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/scripts/cms/**'
      - '.github/workflows/cms-scripts-test.yml'
  push:
    branches:
      - main
    paths:
      - '.github/scripts/cms/**'
      - '.github/workflows/cms-scripts-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run CMS script tests
        run: bun test ./.github/scripts/cms/
