name: Structure Parity

# A translated page must carry the same MDX structure as its English source:
# the same components (counted per tag name), the same number of images and the
# same selected asset links. It compares structure, not image identity: a
# present-but-swapped image or a mistranslated card is outside this gate and
# belongs to the review pass.
# `pnpm translate:dry-run` compares section hashes only, so a localized page can
# silently lose its download cards, workflow previews or card grouping and still
# pass every other check. This job fails the pull request when a translation
# lost structure the English page has, or when an English change left an
# existing translation behind.
#
# Both directions are checked: a changed localized page is compared with its
# English source, and a changed English page is compared with its existing
# ja/zh/ko counterparts. The second direction only fails when the counterpart
# matched the English page before the change, so pre-existing debt never blocks
# a pull request (it is reported as a warning). The backlog is reported by
# `bun .github/scripts/i18n/check-structure-parity.ts --all`.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.mdx'
      - '.github/scripts/i18n/check-structure-parity*'
      - '.github/workflows/structure-parity.yml'
  push:
    branches: [main]
    paths:
      - '**/*.mdx'
      - '.github/scripts/i18n/check-structure-parity*'
      - '.github/workflows/structure-parity.yml'

permissions:
  contents: read

jobs:
  structure-parity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Test structure parity detection
        run: bun test ./.github/scripts/i18n/check-structure-parity.test.ts

      - name: Check changed localized pages against their English source
        env:
          # Diff range for the change under review: `base` up to `head`. For a
          # pull request that is the base branch SHA and the pull request's own
          # head, for a push the previous and the current commit. Read the base
          # branch SHA first: `github.event.before` also exists on pull_request
          # events, where it holds the previous head of the pull request, and
          # diffing that against the checked out merge commit also lists every
          # commit the base branch added after the branch point. The gate would
          # then audit pages this pull request never touched.
          # The script falls back to `<head>~1` when the base is unreachable
          # after a force-push.
          STRUCTURE_PARITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          STRUCTURE_PARITY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun .github/scripts/i18n/check-structure-parity.ts
