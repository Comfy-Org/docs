name: Structure Parity

# A translated page must carry the same MDX structure as its English source:
# the same cards, the same CardGroup wrappers, the same images and asset links.
# `pnpm translate:dry-run` compares section hashes only, so a localized page can
# silently lose its download cards, workflow previews or card grouping and still
# pass every other check. This job fails the pull request when a changed
# localized page lost something the English page has.
#
# The historical backlog (127 files when this landed) is reported by
# `bun .github/scripts/i18n/check-structure-parity.ts --all`; the gate itself is
# scoped to the files a pull request changes, so it never blocks on old debt.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.mdx'
  push:
    branches: [main]
    paths:
      - '**/*.mdx'

permissions:
  contents: read

jobs:
  structure-parity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check changed localized pages against their English source
        env:
          # Event-specific base: previous commit for pushes, base branch SHA
          # for pull requests. The script falls back to HEAD~1 when the base
          # is unreachable after a force-push.
          STRUCTURE_PARITY_BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: bun .github/scripts/i18n/check-structure-parity.ts
