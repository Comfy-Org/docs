name: Giscus comments tests

on:
  pull_request:
    paths:
      - 'giscus-comments.js'
      - '.github/scripts/giscus/**'
      - '.github/workflows/giscus-comments-test.yml'
  push:
    branches:
      - main
    paths:
      - 'giscus-comments.js'
      - '.github/scripts/giscus/**'
      - '.github/workflows/giscus-comments-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: node --check giscus-comments.js

      - name: Run giscus comments tests
        run: node --test .github/scripts/giscus/giscus-comments.test.js
