name: Update Giscus Path Map

# Regenerates the pathname → discussion number map embedded in giscus-comments.js
# so newly created comment threads get number mapping (#1468). Prefer opening a
# PR over pushing to main so the map can be reviewed.

on:
  schedule:
    # Monday 00:00 Asia/Shanghai (UTC+8) == Sunday 16:00 UTC
    - cron: "0 16 * * 0"
  workflow_dispatch:

concurrency:
  group: giscus-path-map-update
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  discussions: read

jobs:
  update-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need a token that can push a branch and open a PR
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate GISCUS_PATH_MAP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Prefer gh over curl; script shells out to `gh api graphql`
          GH_PROMPT_DISABLED: "1"
        run: python3 scripts/generate-giscus-path-map.py

      - name: Check for map changes
        id: diff
        run: |
          if git diff --quiet -- giscus-comments.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No giscus path-map changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- giscus-comments.js
          fi

      - name: Create or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/giscus-path-map-update
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$BRANCH" || true
          git checkout -B "$BRANCH"

          git add giscus-comments.js
          if git diff --cached --quiet; then
            echo "Nothing staged; exiting."
            exit 0
          fi

          git commit -m "$(cat <<'MSG'
          chore(giscus): refresh pathname→discussion number map

          Auto-generated by scripts/generate-giscus-path-map.py so newly
          created Announcements threads are reachable via number mapping
          (#1468).
          MSG
          )"

          git push -u origin "$BRANCH" --force-with-lease

          EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "Updated existing PR #$EXISTING_PR"
            gh pr comment "$EXISTING_PR" --body "Path map refreshed by scheduled workflow run ${{ github.run_id }}."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(giscus): refresh pathname→discussion number map" \
              --body "$(cat <<'BODY'
          ## Summary
          Weekly refresh of the Giscus pathname → discussion number map in `giscus-comments.js`.

          Generated by `scripts/generate-giscus-path-map.py` (GraphQL list of Announcements discussions, not search). Keeps #1468 fix current for newly created comment threads.

          ## Notes
          - Unmapped pages still use pathname + strict so new discussions can be created.
          - Review the diff of `giscus-comments.js` only; no content docs change.
          BODY
          )"
          fi
