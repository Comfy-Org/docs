name: Router Documentation Contract

on:
  pull_request:
    paths:
      - 'development/comfy-router/**'
      - 'comfy-router-*.mdx'
      - 'router-schemas/**'
      - 'snippets/comfy-router/**'
      - 'docs.json'
      - '.github/scripts/router/**'
      - '.github/workflows/router-docs-check.yml'

permissions:
  contents: read

jobs:
  router-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: node .github/scripts/router/check-router-docs.mjs
      - run: python3 .github/scripts/router/reliability_examples_test.py
