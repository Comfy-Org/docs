name: Router Documentation Contract

on:
  pull_request:
    paths:
      - 'development/comfy-router/**'
      - 'comfy-router-*.mdx'
      - 'router-schemas/**'
      - 'snippets/comfy-router/**'
      - 'docs.json'
      - '.github/scripts/router/**'
      - '.github/workflows/router-docs-check.yml'

permissions:
  contents: read

jobs:
  router-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node .github/scripts/router/check-router-docs.mjs
      - run: python3 .github/scripts/router/reliability_examples_test.py
