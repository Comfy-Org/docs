name: Code Pages Freshness

on:
  pull_request:
    paths:
      - 'development/comfy-router/models/**/code.yaml'
      - 'development/comfy-router/models/**/code.mdx'
      - 'snippets/comfy-router/**'
      - 'router-schemas/**'
      - 'tutorials/partner-nodes/pricing.mdx'
      - 'router-pricing/metronome-rates.json'
      - 'development/comfy-router/pricing.mdx'
      - 'ja/development/comfy-router/pricing.mdx'
      - 'zh/development/comfy-router/pricing.mdx'
      - 'ko/development/comfy-router/pricing.mdx'
      - '.github/scripts/i18n/translate-router-pricing*'
      - '.github/scripts/i18n/sync-hash-i18n.ts'
      - '.github/scripts/i18n/chunked-translate.ts'
      - '.github/scripts/i18n/i18n-config.mjs'
      - '.github/scripts/i18n/fix-anchor-slugs.ts'
      - '.github/scripts/i18n/translation-config.json'
      - 'docs.json'
      - '.github/scripts/snippets/**'
      - '.github/workflows/code-pages-check.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  code-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # code-pages:check syntax-checks the Swift snippets with `swiftc -parse`, so this
      # job (and only this job) needs a Swift toolchain. Pinned to a commit SHA: it runs
      # on every PR touching these paths, on a public repo. The cloud-side regen path runs
      # code-pages:gen without --validate, so it still needs bun alone and is unaffected.
      - name: Setup Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.1"

      - name: Check generated code pages are fresh and their snippets parse
        run: bun run code-pages:check

      - name: Check English and localized Router pricing pages are fresh
        run: bun run router-pricing:check

  snippet-script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Fixture-driven, so unlike provider-schemas below it needs no network and cannot go red on a provider outage.
      - name: Run the snippet script unit tests
        run: bun test ./.github/scripts/snippets/

  provider-schemas:
    runs-on: ubuntu-latest
    # Fetches each provider's published spec, so a stalled provider host must not hold the runner.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check documented input/output schemas against each provider's published spec
        run: bun run code-pages:check-providers
