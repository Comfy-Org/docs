name: Code Pages Freshness

on:
  pull_request:
    paths:
      - 'tutorials/partner-nodes/**/code.yaml'
      - 'tutorials/partner-nodes/**/code.mdx'
      - 'snippets/comfy-router/**'
      - 'router-schemas/**'
      - '.github/scripts/snippets/**'
      - '.github/workflows/code-pages-check.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  code-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check generated code pages are fresh and their snippets parse
        run: bun run code-pages:check

  provider-schemas:
    runs-on: ubuntu-latest
    # Fetches each provider's published spec, so a stalled provider host must not hold the runner.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check documented input/output schemas against each provider's published spec
        run: bun run code-pages:check-providers
