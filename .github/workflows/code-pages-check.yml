name: Code Pages Freshness

on:
  pull_request:
    paths:
      - 'tutorials/partner-nodes/**/code.yaml'
      - 'tutorials/partner-nodes/**/code.mdx'
      - 'snippets/comfy-router/**'
      - 'router-schemas/**'
      - '.github/scripts/snippets/**'
      - '.github/workflows/code-pages-check.yml'

permissions:
  contents: read

jobs:
  code-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check generated code pages are fresh and their snippets parse
        run: bun .github/scripts/snippets/gen-code-pages.ts --check --validate

  provider-schemas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check documented input/output schemas against each provider's published spec
        run: bun .github/scripts/snippets/check-provider-schemas.ts
