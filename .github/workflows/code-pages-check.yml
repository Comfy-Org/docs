name: Code Pages Freshness

on:
  pull_request:
    paths:
      - 'development/comfy-router/models/**/code.yaml'
      - 'development/comfy-router/models/**/code.mdx'
      - 'snippets/comfy-router/**'
      - 'router-schemas/**'
      - 'router-openapi.yaml'
      - 'development/comfy-router/reference.mdx'
      - '.github/scripts/router/**'
      - 'docs.json'
      - '.github/scripts/snippets/**'
      - '.github/workflows/code-pages-check.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  router-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - name: Test the reference renderer
        run: python .github/scripts/router/gen_router_reference_test.py
      - name: Check the generated reference matches its public schema
        run: python .github/scripts/router/gen_router_reference.py router-openapi.yaml development/comfy-router/reference.mdx --check

  code-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check generated code pages are fresh and their snippets parse
        run: bun run code-pages:check

  snippet-script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Fixture-driven, so unlike provider-schemas below it needs no network and cannot go red on a provider outage.
      - name: Run the snippet script unit tests
        run: bun test ./.github/scripts/snippets/

  provider-schemas:
    runs-on: ubuntu-latest
    # Fetches each provider's published spec, so a stalled provider host must not hold the runner.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check documented input/output schemas against each provider's published spec
        run: bun run code-pages:check-providers
